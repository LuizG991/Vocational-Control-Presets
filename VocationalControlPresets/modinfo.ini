name=Vocational Control Presets - Gamepad controls per vocation
version=v1.0.0
category=Settings
description=Save a gamepad control preset for each vocation and have the game switch to it automatically when you change vocation. The Warfarer follows the vocation of the weapon in hand.\n\nEvery control in the game's binding table can be changed (buttons and the LB modifier), including all weapon skills. Vocations without a preset always get the game's default layout back.\n\nRequires REFramework (Dragon's Dogma 2). Settings: REFramework menu > Script Generated UI > VocationalControlPresets.
